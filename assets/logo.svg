<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#lbg)"/>

  <!-- Enso-style ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#f59e0b" stroke-width="26"
    stroke-linecap="round" stroke-dasharray="848 150" transform="rotate(35 256 256)"/>

  <!-- Code brackets monogram -->
  <text x="256" y="300" font-family="Menlo, monospace" font-size="150" font-weight="700"
    fill="#fafaf9" text-anchor="middle">{ }</text>
</svg>
